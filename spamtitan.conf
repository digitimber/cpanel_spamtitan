# /var/cpanel/spamtitan/spamtitan.conf
# Configuration for SpamTitan cPanel Hook Script
# -----------------------------------------------

# SpamTitan API connection
BASEURL="https://spamtitanURL/restapi/domains"
TOKEN="YOUR_API_TOKEN_HERE"

# Logging
LOGFILE="/var/log/spamtitan_hook.log"

# API retry behavior
MAX_RETRIES=2          # Number of retries after initial failure
RETRY_DELAY=3          # Seconds between retries
CURL_TIMEOUT=15        # Per-request timeout in seconds

# Default domain policy (applied on domain creation)
DEFAULT_QREPORT_ENABLED=true
DEFAULT_QREPORT_FREQUENCY=D       # D=daily, W=weekly
DEFAULT_QREPORT_CONTAINS=N        # N=new, A=all

# Default authentication settings (applied on domain creation)
DEFAULT_AUTH_TYPE=imap
DEFAULT_IMAP_PORT=993
DEFAULT_IMAP_SECURE=true
DEFAULT_IMAP_ADDRESS_TYPE=user@domain

# ST Domain Admin provisioning
# A mailbox and ST domain admin user will be created on new accounts
ST_ADMIN_USER=SpamTitanAdmin              # Creates SpamTitanAdmin@domain.com
ST_ADMIN_ROLE_ID=6                 # 6 = Domain Administrator role in ST
